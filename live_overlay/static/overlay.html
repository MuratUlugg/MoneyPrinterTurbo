<title>Hediye Arenası</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
/* Yerleşim: 9:16 sahne; ortada 3B pencere (WebGL), üstünde 2B yazı katmanı. Demo modunda altta mod şeridi. */
:root {
  --bg: #140f2e; --panel: #221a4a; --ink: #ffffff; --dim: #b9b2dc;
  --pink: #ff3d7f; --cyan: #2ee6d6; --yellow: #ffd23f;
  --display: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--display); display: flex; flex-direction: column; overflow: hidden; }
html.live body { background: transparent; } /* OBS / Live Studio: şeffaf zemin */
#wrap { flex: 1; min-height: 0; display: grid; place-items: center; }
#stage { position: relative; }
#gl { position: absolute; left: 3.7037%; top: 22.3958%; width: 92.5926%; height: 46.875%; border-radius: 4% / 4.44%; display: block; }
#hud { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
#bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; background: var(--panel);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#bar[hidden] { display: none; }
#bar button { font: 800 15px var(--display); color: var(--ink); background: transparent; border: 2px solid var(--dim);
  border-radius: 999px; padding: 6px 14px; cursor: pointer; }
#bar button[aria-pressed="true"] { background: var(--pink); border-color: var(--pink); }
#bar button.go { background: var(--yellow); border-color: var(--yellow); color: var(--bg); }
#bar button:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
</style>

<div id="wrap"><div id="stage">
  <canvas id="gl" width="1000" height="900"></canvas>
  <canvas id="hud" width="1080" height="1920" aria-label="Canlı yayın bağış animasyonu sahnesi"></canvas>
</div></div>
<div id="bar" hidden>
  <button type="button" data-mode="halay">Halay</button>
  <button type="button" data-mode="race">At Yarışı</button>
  <button type="button" data-mode="taki">Takı Töreni</button>
  <button type="button" data-mode="tug">Çay mı Kahve mi</button>
  <button type="button" data-mode="karpuz">Karpuz</button>
  <button type="button" class="go" id="burst">Hediye yağdır</button>
  <button type="button" id="ses" aria-pressed="false">Ses</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script>
(() => {
'use strict';
const W = 1080, H = 1920, TAU = Math.PI * 2;
const VX = 40, VY = 430, VW = 1000, VH = 900; // 3B pencerenin 2B katmandaki yeri
const qs = new URLSearchParams(location.search);
const DEMO = !window.LIVE_SERVER || qs.get('demo') === '1';
const num = (k, d) => { const v = parseFloat(qs.get(k)); return v > 0 ? v : d; };
// Ayarlar URL ile değiştirilebilir: /overlay?goal=500&taki=1000&halay=600
const CFG = {
  goal: num('goal', 300),        // at yarışı: finiş için gereken jeton
  halay: num('halay', 400),      // halay: coşkuyu doldurmak için gereken jeton
  taki: num('taki', 500),        // takı töreni: ilk düğünün takı hedefi
  tug: num('tug', 300),          // halat: kazanmak için gereken jeton farkı
  karpuzMin: num('karpuzMin', 120), karpuzMax: num('karpuzMax', 450),
  orta: num('orta', 100),        // halay: tek hediyede bu kadar jeton 'ortaya çıkarır'
  hedef: num('hedef', 2000),     // yayın hedefi (toplam jeton); dolunca ikiye katlanır
  konuk: Math.round(num('konuk', 6)), // salonda hazır oturan adsız konuk sayısı (en çok 16)
  buyuk: num('buyuk', 100),      // bu kadar jetonluk tek hediye 'büyük hediye' gösterisi açar
};
const C = { panel: 'rgba(20,15,46,.78)', ink: '#fff', dim: 'rgba(255,255,255,.7)', pink: '#ff3d7f',
  cyan: '#2ee6d6', yellow: '#ffd23f', red: '#ff4d5e', blue: '#4d8dff' };
const FONT = '"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif';
if (!DEMO) document.documentElement.classList.add('live');

const stageEl = document.getElementById('stage'), wrapEl = document.getElementById('wrap');
function fitStage() { const w = Math.min(wrapEl.clientWidth, wrapEl.clientHeight * 9 / 16); stageEl.style.width = w + 'px'; stageEl.style.height = w * 16 / 9 + 'px'; }
addEventListener('resize', fitStage);

const cv = document.getElementById('hud'), ctx = cv.getContext('2d');
let T = 0, mode = null, modeName = '', cel = null, timers = [], pending = [];
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (v, target, dt, speed = 8) => v + (target - v) * Math.min(1, dt * speed);
const fmt = n => Math.round(n).toLocaleString('tr-TR');

// =====================================================================
// 2B KATMAN: yazı, avatar, bildirim, kutlama
// =====================================================================
function setFont(size, weight = 800) { ctx.font = `${weight} ${size}px ${FONT}`; }
function text(s, x, y, size, color = C.ink, align = 'center', stroke = 0, weight = 800) {
  setFont(size, weight); ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = stroke; ctx.strokeStyle = 'rgba(10,6,30,.92)'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function fit(s, maxW, size, weight = 800) {
  setFont(size, weight); s = String(s);
  if (ctx.measureText(s).width <= maxW) return s;
  while (s.length > 1 && ctx.measureText(s + '…').width > maxW) s = s.slice(0, -1);
  return s + '…';
}
function panel(x, y, w, h, r, fill = C.panel) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); }
function avatar(p, x, y, r, ring = '#fff') {
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = p.color; ctx.fill();
  if (p.img && p.img.complete && p.img.naturalWidth) { ctx.clip(); ctx.drawImage(p.img, x - r, y - r, r * 2, r * 2); }
  else text((p.name.trim()[0] || '?').toLocaleUpperCase('tr-TR'), x, y + r * .08, r * 1.15, '#fff');
  ctx.restore();
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.lineWidth = Math.max(3, r * .12); ctx.strokeStyle = ring; ctx.stroke();
  const t = tierOf(p.total); // seviye rozeti
  if (t.min) { const br = Math.max(9, r * .36); ctx.beginPath(); ctx.arc(x + r * .72, y + r * .72, br, 0, TAU); ctx.fillStyle = t.color; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#14102e'; ctx.stroke();
    text('★', x + r * .72, y + r * .72 + 1, br * 1.3, '#14102e'); }
}
function bar(x, y, w, h, ratio, c0, c1, label) {
  panel(x, y, w, h, h / 2, 'rgba(10,6,30,.72)');
  if (ratio > .005) { const g = ctx.createLinearGradient(x, 0, x + w, 0); g.addColorStop(0, c0); g.addColorStop(1, c1);
    panel(x + 6, y + 6, Math.max(h - 12, (w - 12) * clamp(ratio, 0, 1)), h - 12, (h - 12) / 2, g); }
  text(label, x + w / 2, y + h / 2 + 2, h * .5, '#fff', 'center', 7);
}

const players = new Map();
function hash(s) { let h = 7; for (const ch of String(s)) h = (h * 31 + ch.codePointAt(0)) >>> 0; return h; }
function player(u) {
  u = u || {}; const id = String(u.id || u.name || 'anon');
  let p = players.get(id);
  if (!p) { p = { id, name: 'Anonim', hue: hash(id) % 360, total: 0, img: null }; p.color = `hsl(${p.hue} 82% 56%)`; players.set(id, p); }
  if (u.name) p.name = String(u.name);
  if (!p.img && typeof u.avatar === 'string' && /^https:\/\//.test(u.avatar)) {
    p.img = new Image(); p.img.referrerPolicy = 'no-referrer'; p.img.src = u.avatar;
  }
  return p;
}

let parts = [];
function spawn(o) { if (parts.length < 500) parts.push(Object.assign({ vx: 0, vy: 0, g: 0, life: 1, age: 0, size: 10, rot: 0, vr: 0, kind: 'dot', color: '#fff' }, o)); }
function confetti(n = 140) {
  const cols = [C.pink, C.cyan, C.yellow, '#fff', '#9b6bff'];
  for (let i = 0; i < n; i++) spawn({ kind: 'rect', x: rand(W), y: rand(-300, 200), vx: rand(-120, 120), vy: rand(200, 600), g: 300,
    life: rand(2.5, 4.5), size: rand(12, 26), rot: rand(TAU), vr: rand(-8, 8), color: cols[i % cols.length] });
}
function burst(x, y, color, n = 24, speed = 520) {
  for (let i = 0; i < n; i++) { const a = rand(TAU), v = rand(speed * .3, speed);
    spawn({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 700, life: rand(.5, 1.1), size: rand(6, 16), color }); }
}
function floater(s, x, y, color = C.yellow, size = 54) { spawn({ kind: 'text', text: s, x, y, vy: -150, life: 1.2, size, color }); }
function drawParts(dt) {
  parts = parts.filter(p => (p.age += dt) < p.life);
  for (const p of parts) {
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    ctx.globalAlpha = clamp((p.life - p.age) / Math.min(.5, p.life), 0, 1);
    if (p.kind === 'text') text(p.text, p.x, p.y, p.size, p.color, 'center', 10);
    else if (p.kind === 'heart') text('❤', p.x + Math.sin(p.age * 4 + p.rot) * 24, p.y, p.size, p.color);
    else if (p.kind === 'rect') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore(); }
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size / 2, 0, TAU); ctx.fillStyle = p.color; ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}

const snd = { on: qs.get('ses') === '1', ctx: null,
  ac() { if (!this.on) return null; try { this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) { this.on = false; } return this.ctx; },
  tone(f0, f1, dur, vol, type = 'sine') { const c = this.ac(); if (!c) return; const o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur); o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur); },
  noise(dur, vol, freq) { const c = this.ac(); if (!c) return; const n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 1.5) * (.6 + .4 * Math.sin(i / 900));
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; g.gain.value = vol; src.connect(f).connect(g).connect(c.destination); src.start(); },
  dum() { this.tone(110, 45, .28, .9); }, tek() { this.noise(.07, .5, 3200); }, coin() { this.tone(1900, 2600, .25, .25, 'triangle'); }, clap() { this.noise(1.6, .5, 1800); },
};
function after(sec, fn) { timers.push({ t: sec, fn }); }
function celebrate(title, p, sub) { cel = { title, p, sub, t: 0 }; champion = p || champion; hall.cheer = 1.5; snd.clap(); confetti(); }
function drawCelebration(dt) {
  if (!cel) return;
  cel.t += dt; if (cel.t > 5.5) { cel = null; return; }
  const k = Math.min(1, cel.t * 4), out = clamp((5.5 - cel.t) * 4, 0, 1), s = (1 - Math.pow(1 - k, 3)) * out;
  ctx.save(); ctx.translate(540, 880); ctx.scale(s, s); ctx.globalAlpha = out;
  panel(-440, -300, 880, 600, 48, 'rgba(20,15,46,.94)');
  ctx.lineWidth = 8; ctx.strokeStyle = C.yellow; ctx.beginPath(); ctx.roundRect(-440, -300, 880, 600, 48); ctx.stroke();
  text('👑', 0, -238, 84);
  if (cel.p) avatar(cel.p, 0, -80, 104, C.yellow);
  text(fit(cel.p ? cel.p.name : '', 780, 76), 0, 80, 76);
  text(fit(cel.title, 800, 58), 0, 160, 58, C.yellow);
  if (cel.sub) text(fit(cel.sub, 780, 36, 600), 0, 232, 36, C.dim, 'center', 0, 600);
  ctx.restore();
}

const alerts = []; let alertCur = null;
// Seviyeler: yayın boyunca toplam hediyeye göre rozet; bir sonraki seviyeye kalan miktar her hediyede gösterilir
const TIERS = [{ min: 0, name: '' }, { min: 10, name: 'Bronz', color: '#e0935a' }, { min: 100, name: 'Gümüş', color: '#d7dbe6' }, { min: 500, name: 'Altın', color: '#ffd23f' }, { min: 2000, name: 'Elmas', color: '#6ee7ff' }];
const tierOf = total => TIERS.filter(t => total >= t.min).pop();
const combo = { n: 0, t: 0 }, comboMult = () => 1 + Math.min(Math.max(combo.n - 1, 0), 10) * .1;
const bigs = []; let session = 0, goal = CFG.hedef, champion = null;
const leader = () => [...players.values()].filter(p => p.total > 0).sort((a, b) => b.total - a.total)[0] || null;
function pushAlert(p, line, sub = '') {
  const last = alerts[alerts.length - 1];
  if (alerts.length > 30) alerts.shift();
  if (!(last && last.p === p && last.line === line)) alerts.push({ p, line, sub, t: 0 });
}
function drawAlerts(dt) {
  if (!alertCur && alerts.length) alertCur = alerts.shift();
  if (!alertCur) return;
  const a = alertCur, dur = alerts.length > 4 ? .7 : alerts.length ? 1.4 : 2.4;
  a.t += dt; if (a.t > dur) { alertCur = null; return; }
  const k = Math.min(1, a.t * 6), out = clamp((dur - a.t) * 6, 0, 1);
  const x = lerp(-760, 50, 1 - Math.pow(1 - k, 3));
  ctx.globalAlpha = out;
  const grad = ctx.createLinearGradient(x, 0, x + 760, 0); grad.addColorStop(0, C.pink); grad.addColorStop(1, 'rgba(255,61,127,.15)');
  panel(x, 1476, 760, 140, 70, grad);
  avatar(a.p, x + 72, 1546, 54);
  text(fit(a.p.name, 590, 38), x + 144, 1510, 38, '#fff', 'left', 6);
  text(fit(a.line, 590, 32), x + 144, 1550, 32, C.yellow, 'left', 6);
  if (a.sub) text(fit(a.sub, 590, 25), x + 144, 1588, 25, C.cyan, 'left', 5);
  ctx.globalAlpha = 1;
}
function drawHeader() {
  const s = 1 + Math.sin(T * 2.4) * .015;
  ctx.save(); ctx.translate(540, 290); ctx.scale(s, s);
  text(mode.title, 0, 0, 92, C.yellow, 'center', 16);
  ctx.restore();
  const hints = mode.hints, i = Math.floor(T / 4.5) % hints.length, ph = (T / 4.5) % 1;
  ctx.globalAlpha = clamp(Math.min(ph * 8, (1 - ph) * 8), 0, 1); text(fit(hints[i], 1000, 36), 540, 356, 36, '#fff', 'center', 9); ctx.globalAlpha = 1;
  bar(190, 384, 700, 36, session / goal, C.pink, C.yellow, `YAYIN HEDEFİ  💎 ${fmt(session)} / ${fmt(goal)}`);
}
function drawCombo(dt) {
  combo.t = Math.max(0, combo.t - dt); if (combo.t <= 0) combo.n = 0;
  if (combo.n < 2) return;
  const s = 1 + Math.sin(T * 10) * .03;
  ctx.save(); ctx.translate(880, 1150); ctx.rotate(-.06); ctx.scale(s, s);
  panel(-130, -52, 260, 104, 26, 'rgba(10,6,30,.78)');
  text(`KOMBO ×${comboMult().toFixed(1)} 🔥`, 0, -14, 34, C.yellow, 'center', 6);
  text(`hediyeler %${Math.round((comboMult() - 1) * 100)} daha etkili`, 0, 20, 17, '#fff', 'center', 4);
  ctx.fillStyle = C.pink; ctx.fillRect(-110, 38, 220 * combo.t / 8, 6);
  ctx.restore();
}
function drawBig(dt) { // büyük hediye: gönderen birkaç saniye sahnenin yıldızı
  const b = bigs[0]; if (!b) return;
  if (!b.t) for (let i = 0; i < 5; i++) burst(rand(200, 880), rand(560, 900), [C.pink, C.yellow, C.cyan][i % 3], 34, 900);
  b.t += dt; if (b.t > 3.2) { bigs.shift(); return; }
  const k = Math.min(1, b.t * 5), out = clamp((3.2 - b.t) * 5, 0, 1), s = (1 - Math.pow(1 - k, 3)) * out, epic = b.amount >= CFG.buyuk * 10;
  ctx.save(); ctx.translate(540, 580); ctx.scale(s * .9, s * .9); ctx.globalAlpha = out;
  const g = ctx.createLinearGradient(-470, 0, 470, 0); g.addColorStop(0, epic ? '#6ee7ff' : C.pink); g.addColorStop(1, epic ? '#9b6bff' : '#ff9a3d');
  panel(-470, -120, 940, 240, 60, g); ctx.lineWidth = 8; ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.roundRect(-470, -120, 940, 240, 60); ctx.stroke();
  avatar(b.p, -350, 0, 88, C.yellow);
  text(epic ? '🌟 EFSANE HEDİYE 🌟' : '💥 BÜYÜK HEDİYE', 90, -66, 44, '#fff', 'center', 8);
  text(fit(b.p.name, 640, 70), 90, -2, 70, '#fff', 'center', 12);
  text(fit(`${b.name}  ·  💎 ${fmt(b.amount)}`, 640, 42), 90, 70, 42, C.yellow, 'center', 8);
  ctx.restore();
}
function drawDonors() {
  const top = [...players.values()].filter(p => p.total > 0).sort((a, b) => b.total - a.total).slice(0, 3);
  if (!top.length) return;
  panel(60, 1350, 960, 96, 48);
  text('👑', 110, 1398, 44);
  top.forEach((p, i) => {
    const x = 160 + i * 280;
    avatar(p, x + 30, 1398, 28, [C.yellow, '#d7dbe6', '#e0a070'][i]);
    text(fit(p.name, 190, 28), x + 68, 1384, 28, '#fff', 'left');
    text('💎 ' + fmt(p.total), x + 68, 1416, 24, C.cyan, 'left');
  });
  // en yakın rakibe kalan fark: sıralamada yükselmek için gereken net miktar
  const all = [...players.values()].filter(p => p.total > 0).sort((a, b) => b.total - a.total), turn = Math.floor(T / 4) % Math.max(1, Math.min(all.length - 1, 4)) + 1;
  if (all.length > 1) text(fit(`🔥 ${all[turn].name}: ${turn}. sıraya 💎 ${fmt(all[turn - 1].total - all[turn].total + 1)} kaldı`, 900, 27), 540, 1640, 27, '#fff', 'center', 6);
  if (champion) text(fit(`🏆 Son şampiyon: ${champion.name}`, 900, 27), 540, 1678, 27, C.yellow, 'center', 6);
}

// =====================================================================
// 3B ALTYAPI
// =====================================================================
const THREE = window.THREE, HAS3D = !!(THREE && THREE.GLTFLoader && THREE.SkeletonUtils);
let renderer = null, glError = HAS3D ? '' : '3B kütüphanesi yüklenemedi (internet bağlantısını kontrol edin)';
const assets = { horse: null, bot: null, bride: null };
if (HAS3D) {
  try {
    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true });
    renderer.setPixelRatio(1); renderer.setSize(VW, VH, false);
    renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    const loader = new THREE.GLTFLoader(), fail = () => { glError = '3B modeller yüklenemedi'; };
    const ext = window.LIVE_SERVER ? '' : '.wasm'; // sunucusuz önizleme barındırıcısı .glb sunmadığı için aynı dosya orada farklı uzantıyla durur
    loader.load('models/Horse.glb' + ext, g => { assets.horse = g; }, undefined, fail);
    loader.load('models/Groom.glb' + ext, g => { assets.bot = g; }, undefined, fail);
    loader.load('models/Bride.glb' + ext, g => { assets.bride = g; }, undefined, fail);
  } catch (e) { glError = 'Bu tarayıcıda WebGL açılamadı'; }
}
const ready = () => renderer && assets.horse && assets.bot && assets.bride;
const V = HAS3D ? new THREE.Vector3() : null, Q = HAS3D ? new THREE.Quaternion() : null, E = HAS3D ? new THREE.Euler() : null;
function proj(cam, x, y, z) { V.set(x, y, z).project(cam); return [VX + (V.x + 1) / 2 * VW, VY + (1 - V.y) / 2 * VH]; }
function canvasTex(w, h, fn, rx = 1, ry = 1) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.anisotropy = 8; return t;
}
function speckTex(base, specks, n, rx, ry) {
  return canvasTex(256, 256, (g, w, h) => { g.fillStyle = base; g.fillRect(0, 0, w, h);
    for (let i = 0; i < n; i++) { g.fillStyle = specks[i % specks.length]; g.globalAlpha = rand(.25, .8); g.fillRect(rand(w), rand(h), rand(2, 7), rand(2, 9)); } }, rx, ry);
}
const std = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: .8 }, o));
function mesh(geo, mat, x = 0, y = 0, z = 0, cast = true) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = cast; m.receiveShadow = true; return m; }
function baseScene(top, bottom, o = {}) {

const halay = {
  title: 'DÜĞÜN HALAYI',
  hints: ['💬 Yorum yaz, düğünde masana otur', '🌹 Tek bir Gül at, masadan kalk halaya gir!', `💸 ${CFG.orta}+ 💎 at: ortaya çık, üstüne para saçılsın!`, 'En cömert, mendili sallayan halay başı olur', 'Coşku dolunca halay başı ilan edilir 🔥'],

    d.v += raw; d.plus = { a: raw, t: 0 };

    if (raw >= CFG.orta && !this.soloQ.includes(p.id) && !(this.solo && this.solo.id === p.id)) this.soloQ.push(p.id);
    this.cosku = Math.min(100, this.cosku + a / CFG.halay * 100);
    if (this.cosku >= 100) {
      this.locked = true; // coşku doldu: son bir hızlı tur, sonra halay başı ilan edilir
      after(2.6, () => { const b = [...this.d.values()].sort((x, y) => y.v - x.v)[0];

  like(p, n) { this.cosku = Math.min(99, this.cosku + n * .02); },
  update(dt) {
    if (!this.locked) this.cosku = Math.max(0, this.cosku - dt * .5);
    this.shown = ease(this.shown, this.cosku, dt, 5);
    const tempo = 3.4 + this.shown / 100 * 4.5;

    const { s } = baseScene('#58a8ea', '#d8efff', { amb: .9, sun: 1.45, range: 9 });
    this.scene = s; this.cam = camera(34, 0, 2.5, 10.6, 0, 1.15, 0);
    const g = mesh(new THREE.PlaneGeometry(60, 40), std('#fff', { map: speckTex('#4aa544', ['#398c36', '#5fbb55'], 900, 20, 14), roughness: 1 }), 0, 0, 0, false); g.rotation.x = -Math.PI / 2; s.add(g);
    const ln = (x, c, w) => { const m = mesh(new THREE.PlaneGeometry(w, 5), std(c), x, .02, 0, false); m.rotation.x = -Math.PI / 2; s.add(m); };
    ln(0, '#ffffff', .12); ln(-2, this.cols[0], .2); ln(2, this.cols[1], .2);
    const rope = this.rope = mesh(new THREE.CylinderGeometry(.045, .045, 11, 10), std('#fff', { map: canvasTex(64, 64, (c) => { c.fillStyle = '#d9b27a'; c.fillRect(0, 0, 64, 64); c.strokeStyle = '#a57c45'; c.lineWidth = 6; for (let i = -64; i < 128; i += 16) { c.beginPath(); c.moveTo(i, 0); c.lineTo(i + 64, 64); c.stroke(); } }, 1, 30), roughness: .9 }), 0, 1.02, 0);
    rope.rotation.z = Math.PI / 2; s.add(rope);
    this.flag = mesh(new THREE.BoxGeometry(.1, .55, .1), std('#ffd23f', { emissive: '#7a5a00', emissiveIntensity: .4 }), 0, .82, 0); s.add(this.flag);
    // ince belli çay bardağı ve kahve fincanı
    const pts = [[0, 0], [.42, 0], [.5, .12], [.34, .55], [.3, .8], [.4, 1.15], [.52, 1.5], [.5, 1.52]].map(p => new THREE.Vector2(p[0], p[1]));
    const tea = mesh(new THREE.LatheGeometry(pts, 32), new THREE.MeshPhysicalMaterial({ color: '#8f0a05', roughness: .1, clearcoat: 1, emissive: '#3a0200', emissiveIntensity: .4 }), -3.5, .1, -3.4); tea.scale.setScalar(1.25); s.add(tea);
    s.add(mesh(new THREE.CylinderGeometry(1.1, .9, .1, 32), std('#ffffff', { roughness: .25 }), -3.5, .05, -3.4));
    const cupP = [[0, 0], [.45, 0], [.62, .2], [.74, .7], [.76, .95], [.7, .95], [.66, .72]].map(p => new THREE.Vector2(p[0], p[1]));
    const cup = mesh(new THREE.LatheGeometry(cupP, 32), std('#ffffff', { roughness: .2, side: THREE.DoubleSide }), 3.5, .1, -3.4); cup.scale.setScalar(1.2); s.add(cup);
    s.add(mesh(new THREE.CylinderGeometry(.8, .8, .04, 32), std('#3b2010', { roughness: .4 }), 3.5, 1.1, -3.4));
    s.add(mesh(new THREE.CylinderGeometry(1.25, 1.0, .1, 32), std('#ffffff', { roughness: .25 }), 3.5, .05, -3.4));
    s.add(mesh(new THREE.TorusGeometry(.3, .08, 10, 20), std('#ffffff', { roughness: .2 }), 4.5, .75, -3.4));
    this.acts = new Map();
  },
  reset() {
    if (this.acts) { for (const a of this.acts.values()) dispose(this.scene, a); this.acts.clear(); }
    this.pos = this.shown = 0; this.member = new Map(); this.team = [new Map(), new Map()]; this.tot = [0, 0]; this.locked = false; this.vis = [[], []];
  },
  join(p, t) { if (!this.team[0].has(p.id) && !this.team[1].has(p.id)) this.member.set(p.id, t); },
  comment(p, s) {
    s = s.toLocaleLowerCase('tr-TR').trim();
    if (s === '1' || /[çc]ay/.test(s)) this.join(p, 0); else if (s === '2' || s.includes('kahve')) this.join(p, 1);
  },
  gift(p, a, raw) {
    let t = this.member.get(p.id);
    if (t === undefined) { t = this.tot[0] <= this.tot[1] ? 0 : 1; this.member.set(p.id, t); } // seçmeyen zayıf takıma
    this.team[t].set(p.id, { p, v: (this.team[t].get(p.id)?.v || 0) + raw });
    this.tot[t] += raw; this.pos = clamp(this.pos + (t ? 1 : -1) * a / CFG.tug, -1, 1); this.tugT = 1; this.tugDir = t ? 1 : -1;
    floater('+' + fmt(raw), t ? 800 : 280, 700, this.cols[t]);
    if (Math.abs(this.pos) >= 1) {
      this.locked = true;
      const mvp = [...this.team[t].values()].sort((x, y) => y.v - x.v)[0];
      after(1.4, () => { celebrate(t ? 'KAHVECİLER KAZANDI!' : 'ÇAYCILAR KAZANDI!', mvp.p, `Takımın yıldızı · 💎 ${fmt(mvp.v)}`); this.reset(); });
    }
  },
  update(dt) {
    this.shown = ease(this.shown, this.pos, dt, 4); this.tugT = Math.max(0, (this.tugT || 0) - dt * 1.5);
    this.vis = [0, 1].map(t => [...this.team[t].values()].sort((a, b) => b.v - a.v).slice(0, 3));
    if (!this.built) return;
    const mx = this.shown * 2, ids = new Set(this.vis.flat().map(m => m.p.id));
    for (const [id, a] of this.acts) if (!ids.has(id)) { dispose(this.scene, a); this.acts.delete(id); }
    this.flag.position.x = mx; this.rope.position.x = mx;
    this.vis.forEach((list, t) => list.forEach((m, i) => {
      let a = this.acts.get(m.p.id);
      if (!a) { a = makeBot(this.tint[t], lookOf(m.p.id)); this.acts.set(m.p.id, a); this.scene.add(a.root); }
      const d = t ? 1 : -1, pull = (this.tugDir === d ? this.tugT : -this.tugT * .5), w = Math.sin(T * 7 + i * 2 + t), lean = .2 + pull * .14 + w * .03;
      m.x = mx + d * (.9 + i * .82); a.root.position.set(m.x, 0, .12); a.root.rotation.y = -d * Math.PI / 2; // rakibe dönük
      P(a, 'Hips', -lean, 0, 0); P(a, 'Spine', -.1, 0, 0);
      P(a, 'LeftUpLeg', -.22 + lean - w * .1, 0, 0); P(a, 'LeftLeg', .25, 0, 0); P(a, 'RightUpLeg', .1 + lean + w * .1, 0, 0); P(a, 'RightLeg', .35, 0, 0);
      arm(a, 'Left', -.25, .62); arm(a, 'Right', -.25, .62);
    }));
  },
  draw() {
    [0, 1].forEach(t => {
      const x = t ? 790 : 290;
      panel(x - 210, 446, 420, 128, 40, t ? 'rgba(84,50,24,.86)' : 'rgba(150,30,24,.86)');
      text(this.names[t], x, 486, 54, this.cols[t], 'center', 10);
      text('💎 ' + fmt(this.tot[t]), x, 542, 38, '#fff', 'center', 8);
      const extra = this.team[t].size - 3; if (extra > 0) text(`+${extra} kişi`, x, 1290, 28, '#fff', 'center', 6);
      if (this.built) this.vis[t].forEach(m => { if (m.x === undefined) return; const [px, py] = proj(this.cam, m.x, 2.2, .12);
        avatar(m.p, px, py, 30, this.cols[t]); text(fit(m.p.name, 120, 22), px, py - 44, 22, '#fff', 'center', 6); });
    });
    if (!this.tot[0] && !this.tot[1]) text('Tarafını seç, halata asıl! 💪', 540, 1250, 46, '#fff', 'center', 10);
  },
};

// =====================================================================
// MOD 5 — KARPUZ PATLATMA
// =====================================================================
const karpuz = {
  title: 'KARPUZU PATLAT',
  hints: ['Her hediye karpuza bir lastik takar 🍉', 'Son lastiği takan kazanır: belki seninki!', 'Karpuz ne zaman patlar? Kimse bilmiyor…'],
  build() {
    const { s } = baseScene('#3d95e6', '#d6eeff', { amb: .85, sun: 1.5, range: 5 });
    this.scene = s; this.cam = camera(30, 0, 2.2, 6.2, 0, 1.05, 0);
    const g = mesh(new THREE.PlaneGeometry(60, 40), std('#fff', { map: speckTex('#4aa544', ['#398c36', '#5fbb55'], 900, 20, 14), roughness: 1 }), 0, 0, 0, false); g.rotation.x = -Math.PI / 2; s.add(g);
    const wood = canvasTex(256, 256, (c, w, h) => { c.fillStyle = '#b07a45'; c.fillRect(0, 0, w, h); for (let i = 0; i < 60; i++) { c.strokeStyle = `rgba(70,40,15,${rand(.1, .35)})`; c.lineWidth = rand(1, 3); const y = rand(h); c.beginPath(); c.moveTo(0, y); c.bezierCurveTo(80, y + rand(-8, 8), 170, y + rand(-8, 8), w, y); c.stroke(); } }, 2, 1);
    s.add(mesh(new THREE.BoxGeometry(3.6, .14, 2.2), std('#fff', { map: wood, roughness: .55 }), 0, .43, 0));
    for (const [x, z] of [[-1.6, -.9], [1.6, -.9], [-1.6, .9], [1.6, .9]]) s.add(mesh(new THREE.BoxGeometry(.14, .4, .14), std('#8a5a30'), x, .2, z));
    this.rind = canvasTex(512, 256, (c, w, h) => { c.fillStyle = '#3aa348'; c.fillRect(0, 0, w, h); c.fillStyle = '#17602a';
      for (let i = 0; i < 12; i++) { const x0 = (i + .5) * w / 12; c.beginPath(); c.moveTo(x0 - 9, 0); for (let y = 0; y <= h; y += 8) c.lineTo(x0 + 11 + Math.sin(y * .22 + i) * 7, y); for (let y = h; y >= 0; y -= 8) c.lineTo(x0 - 11 + Math.sin(y * .19 + i * 2) * 7, y); c.fill(); } });
    this.melon = mesh(new THREE.SphereGeometry(1, 8, 8), std('#fff', { map: this.rind, roughness: .32 }), 0, 1.22, 0); s.add(this.melon);
    this.bandGeo = new THREE.TorusGeometry(1, .012, 6, 40); this.bandGeo.rotateX(Math.PI / 2); this.bandMat = std('#e6c690', { roughness: .7 });
    this.bandMeshes = []; this.chunks = []; this.geoRatio = -1;
  },
  shape(ratio) { // lastikler ortayı sıktıkça bel incelir, iki yarı şişer
    const pts = [], R = .72, Ry = .6 * (1 + .16 * ratio);
    for (let i = 0; i <= 44; i++) { const a = i / 44 * Math.PI, pinch = 1 - .46 * ratio * Math.exp(-Math.pow((a - Math.PI / 2) / .3, 2));
      pts.push(new THREE.Vector2(Math.max(.0001, Math.sin(a) * R * pinch * (1 + .1 * ratio * Math.abs(Math.cos(a)))), -Math.cos(a) * Ry)); }
    this.melon.geometry.dispose(); this.melon.geometry = new THREE.LatheGeometry(pts, 40); this.waist = R * (1 - .46 * ratio);
  },
  reset() {
    if (this.built) { for (const c of this.chunks) this.scene.remove(c.m); this.chunks = []; this.melon.visible = true; this.geoRatio = -1; }
    this.size = this.shown = 0; this.limit = rand(CFG.karpuzMin, CFG.karpuzMax); this.last = null; this.bump = 0; this.gone = false; this.locked = false; this.n = new Set(); this.bands = 0;
  },
  gift(p, a) {
    this.size += a; this.last = p; this.bump = 1; this.n.add(p.id); this.bands++;
    if (this.size >= this.limit) {
      this.locked = true;
      after(.7, () => { // kısa bir gerilim anı, sonra patlama
        this.gone = true;
        if (this.built) { this.melon.visible = false; const geo = new THREE.IcosahedronGeometry(1, 0);
          for (let i = 0; i < 70; i++) { const m = new THREE.Mesh(geo, std(i % 5 === 0 ? '#1f7a30' : i % 7 === 0 ? '#16110f' : '#ff3347', { roughness: .45, flatShading: true }));
            const sc = i % 7 === 0 ? .03 : rand(.05, .2); m.scale.set(sc, sc * rand(.5, 1), sc); m.position.set(rand(-.4, .4), 1.22 + rand(-.4, .4), rand(-.4, .4)); m.castShadow = true;
            const an = rand(TAU), sp = rand(1.5, 6); this.chunks.push({ m, v: [Math.cos(an) * sp, rand(2, 8), Math.sin(an) * sp * .8 + 1], w: [rand(-9, 9), rand(-9, 9), rand(-9, 9)] }); this.scene.add(m); } }
        for (let i = 0; i < 6; i++) burst(540 + rand(-150, 150), 880 + rand(-150, 150), ['#ff3b4f', '#ff6b7a', '#2f9e44'][i % 3], 30, 1100);
        floater('ÇAT!', 540, 860, C.yellow, 160);
        after(1.3, () => { celebrate('KARPUZU PATLATTI!', p, `${this.bands} lastik · ${this.n.size} kişi birlikte sıktı`); this.reset(); });
      });
    }
  },
  update(dt) {
    this.shown = ease(this.shown, this.size, dt, 7); this.bump = Math.max(0, this.bump - dt * 3);
    if (!this.built) return;
    const ratio = clamp(this.shown / CFG.karpuzMax, 0, 1);
    if (Math.abs(ratio - this.geoRatio) > .004) { this.shape(ratio); this.geoRatio = ratio; }
    const sh = this.locked ? .035 : ratio * ratio * .014;
    this.melon.position.set(rand(-1, 1) * sh, 1.22 + rand(-1, 1) * sh, 0); this.melon.rotation.y = .4 + Math.sin(T * .4) * .25;
    const nb = this.gone ? 0 : Math.min(40, this.bands);
    while (this.bandMeshes.length < nb) { const b = new THREE.Mesh(this.bandGeo, this.bandMat); this.scene.add(b); this.bandMeshes.push(b); }
    this.bandMeshes.forEach((b, i) => { b.visible = i < nb; if (!b.visible) return; const w = this.waist + .012 + (i % 3) * .004 - this.bump * .01;
      b.scale.set(w, 1, w); b.position.set(this.melon.position.x, this.melon.position.y + (i - (nb - 1) / 2) * Math.min(.014, .16 / nb), 0); b.rotation.z = Math.sin(i * 7.3) * .05; });
    for (const c of this.chunks) { c.v[1] -= 14 * dt; c.m.position.x += c.v[0] * dt; c.m.position.y += c.v[1] * dt; c.m.position.z += c.v[2] * dt;
      if (c.m.position.y < .06) { c.m.position.y = .06; c.v[1] *= -.3; c.v[0] *= .6; c.v[2] *= .6; c.w = c.w.map(x => x * .5); }
      c.m.rotation.x += c.w[0] * dt; c.m.rotation.y += c.w[1] * dt; c.m.rotation.z += c.w[2] * dt; }
    this.cam.position.x = Math.sin(T * .3) * .5; this.cam.lookAt(0, 1.05, 0);
  },
  draw() {
    const danger = this.size >= CFG.karpuzMin;
    bar(140, 452, 800, 66, 0, C.cyan, C.pink, danger && !this.gone ? '⚠ HER AN PATLAYABİLİR!' : `${this.bands} LASTİK TAKILDI`);
    if (danger && !this.gone) text(`${this.bands} LASTİK`, 540, 560, 40, '#fff', 'center', 9);
    if (this.last) { panel(220, 1232, 640, 78, 39, 'rgba(10,6,30,.66)'); avatar(this.last, 266, 1271, 30, C.yellow);
      text('Son lastik: ' + fit(this.last.name, 380, 32), 312, 1271, 32, '#fff', 'left'); }
    else text('İlk lastiği sen tak!', 540, 1271, 44, '#fff', 'center', 9);
  },
};

const MODES = { halay, race, taki, tug, karpuz };

// =====================================================================
// OLAY AKIŞI + ANA DÖNGÜ
// =====================================================================
function setMode(name) {
  if (!MODES[name] || name === modeName) return;
  if (mode) mode.reset(); // eski modun sahnedeki oyuncularını kaldır
  modeName = name; mode = MODES[name]; timers = []; pending = []; cel = null; parts = []; mode.reset();
  document.querySelectorAll('#bar [data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === name)));
}
function giveToMode(p, a, raw) { if (mode.locked) pending.push([p, a, raw]); else mode.gift(p, a, raw); }
function onEvent(ev) {
  if (!ev || typeof ev !== 'object') return;
  if (ev.type === 'state') return setMode(qs.get('mode') || ev.mode);
  if (ev.type === 'reset') { timers = []; pending = []; cel = null; players.clear(); session = 0; goal = CFG.hedef; champion = null; combo.n = combo.t = 0; bigs.length = 0; hall.clear(); mode.reset(); return; }
  const p = player(ev.user);
  if (ev.type !== 'gift' && mode.hall && !(mode === halay && halay.d.has(p.id))) hall.sit(p);
  if (ev.type === 'gift') {
    const g = ev.gift || {}, count = Math.max(1, g.count | 0), amount = Math.max(1, Number(ev.total) || (g.diamonds || 1) * count);
    const before = tierOf(p.total), leaderBefore = leader();
    p.total += amount; session += amount;
    const tier = tierOf(p.total), next = TIERS[TIERS.indexOf(tier) + 1];
    // Kombo: 8 sn içinde art arda gelen hediyeler oyundaki etkiyi artırır (gerçek jeton sayısı değişmez)
    combo.n = combo.t > 0 ? combo.n + 1 : 1; combo.t = 8;
    pushAlert(p, `${count > 1 ? count + '× ' : ''}${g.name || 'Hediye'} gönderdi  💎${fmt(amount)}`, next ? `${next.name} seviyesine 💎 ${fmt(next.min - p.total)} kaldı` : 'En üst seviye: Elmas 💎');
    if (tier !== before && tier.min >= 100) { floater(`${p.name}: ${tier.name} seviye!`, 540, 1100, tier.color, 50); }
    if (amount >= CFG.buyuk) { bigs.push({ p, amount, name: g.name || 'Hediye', t: 0 }); hall.cheer = 1.5; }
    const lead = leader(); if (leaderBefore && lead !== leaderBefore && lead === p) pushAlert(p, '👑 Liderliği kaptı!', `${leaderBefore.name} geri almak için 💎 ${fmt(p.total - leaderBefore.total + 1)}`);
    if (session >= goal) { floater('YAYIN HEDEFİ TAMAM! 🎉', 540, 600, C.yellow, 70); confetti(120); goal *= 2; }
    giveToMode(p, amount * comboMult(), amount);
  } else if (ev.type === 'like') {
    const n = Math.max(1, ev.count | 0);
    for (let i = 0; i < Math.min(n, 5); i++) spawn({ kind: 'heart', x: rand(880, 1010), y: 1440, vy: rand(-420, -260), life: rand(1.6, 2.6), size: rand(40, 70), rot: rand(TAU), color: [C.pink, '#ff7aa8', C.red][i % 3] });
    if (mode.like && !mode.locked) mode.like(p, n);
  } else if (ev.type === 'follow') pushAlert(p, 'takip etti ⭐');
  else if (ev.type === 'share') pushAlert(p, 'yayını paylaştı 🚀');
  else if (ev.type === 'comment' && mode.comment) mode.comment(p, String(ev.text || ''));
}

let lastT = performance.now();
function frame(now) {
  const dt = clamp((now - lastT) / 1000, 0, .05); lastT = now; T += dt;
  const due = timers.filter(t => (t.t -= dt) <= 0); timers = timers.filter(t => t.t > 0);
  due.forEach(t => t.fn());
  if (!mode.locked && pending.length) { const q = pending; pending = []; q.forEach(([p, a, raw]) => giveToMode(p, a, raw)); }
  if (DEMO) demoTick(dt);
  if (ready() && !mode.built) { mode.build(); mode.built = true; }
  mode.update(dt);
  if (mode.built) renderer.render(mode.scene, mode.cam);

  ctx.clearRect(0, 0, W, H);
  if (DEMO) { const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#2a1560'); g.addColorStop(.55, '#140f2e'); g.addColorStop(1, '#0d2b4a'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'destination-out'; panel(VX, VY, VW, VH, 40, '#000'); ctx.globalCompositeOperation = 'source-over'; }
  if (!mode.built) { panel(VX, VY, VW, VH, 40); text(glError || '3B sahne yükleniyor…', 540, 880, 40, glError ? C.yellow : '#fff'); }
  drawHeader(); mode.draw(); drawCombo(dt); drawDonors(); drawParts(dt); drawAlerts(dt); drawBig(dt); drawCelebration(dt);
  requestAnimationFrame(frame);
}

// ---------- demo: sahte izleyiciler (yalnızca önizleme) ----------
const DEMO_NAMES = ['Ayşe', 'Mehmet', 'Zeynep', 'Emre', 'Elif', 'Can', 'Deniz', 'Selin', 'Burak', 'Ece', 'Kerem', 'Melis', 'Onur', 'İrem'];
const DEMO_GIFTS = [['Gül', 1, 8], ['TikTok', 1, 5], ['Parmak Kalp', 5, 5], ['Donut', 30, 3], ['Şapka', 99, 1.2], ['Konfeti', 100, .8]];
let demoT = .4;
function demoUser() { const name = DEMO_NAMES[Math.floor(rand(DEMO_NAMES.length))]; return { id: 'demo:' + name, name }; }
function demoGift() {
  let r = rand(DEMO_GIFTS.reduce((s, g) => s + g[2], 0)), g = DEMO_GIFTS[0];
  for (const x of DEMO_GIFTS) { if (r < x[2]) { g = x; break; } r -= x[2]; }
  const count = g[1] < 10 ? Math.ceil(rand(8)) : 1;
  onEvent({ type: 'gift', user: demoUser(), gift: { name: g[0], diamonds: g[1], count }, total: g[1] * count });
}
function demoTick(dt) {
  if ((demoT -= dt) > 0) return;
  demoT = rand(.35, 1.3);
  const r = Math.random();
  if (r < .55) demoGift();
  else if (r < .85) onEvent({ type: 'like', user: demoUser(), count: Math.ceil(rand(15)) });
  else if (r < .95) onEvent({ type: 'comment', user: demoUser(), text: Math.random() < .5 ? 'çay' : 'kahve' });
  else onEvent({ type: 'follow', user: demoUser() });
}

// ---------- başlat ----------
setMode(MODES[qs.get('mode')] ? qs.get('mode') : 'halay');
if (DEMO) {
  const barEl = document.getElementById('bar'); barEl.hidden = false;
  barEl.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.id === 'ses') { snd.on = !snd.on; b.setAttribute('aria-pressed', String(snd.on)); snd.dum(); return; }
    if (b.dataset.mode) setMode(b.dataset.mode);
    for (let i = 0; i < (b.dataset.mode ? 5 : 8); i++) demoGift(); // mod değişince sahne boş kalmasın
  });
  for (let i = 0; i < 6; i++) demoGift(); // ilk kare dolu görünsün
}
fitStage();
if (window.LIVE_SERVER) {
  (function connect() {
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.onmessage = m => { try { onEvent(JSON.parse(m.data)); } catch (err) { console.error(err); } };
    ws.onclose = () => setTimeout(connect, 2000);
  })();
}
requestAnimationFrame(frame);
})();
</script>
